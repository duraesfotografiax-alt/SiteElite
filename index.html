<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elite Marketing Digital | Conteúdo profissional e tráfego pago</title>
<meta name="description" content="Fotografia, vídeos, gestão de redes sociais e tráfego pago para o seu negócio vender mais. Elite Marketing Digital.">
<meta property="og:title" content="Elite Marketing Digital">
<meta property="og:description" content="Conteúdo profissional e estratégias digitais para o seu negócio. Mais visibilidade, mais cliques, mais clientes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#04070D;--bg-2:#0A111E;--card:rgba(255,255,255,.035);--line:rgba(255,255,255,.12);--ink:#F2F4F8;--muted:#A3ADBD;--gold:#D9A94E;--gold-2:#F4D58D;--blue:#3B82F6;--blue-2:#60A5FA;--font:"Montserrat","Segoe UI","Helvetica Neue",Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{overflow-x:hidden;scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.gold{background:linear-gradient(100deg,var(--gold),var(--gold-2) 45%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold-2)}
.kicker::before{content:"";width:22px;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
h1,h2,h3{margin:0;line-height:1.08;letter-spacing:-.015em}
h2{font-size:clamp(1.9rem,5.4vw,3rem);font-weight:800}
.lead{color:var(--muted);font-size:clamp(1rem,2.6vw,1.12rem);max-width:58ch;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font:700 .95rem/1 var(--font);letter-spacing:.02em;text-decoration:none;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold-bg{background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#1A1206;border-color:transparent;box-shadow:0 10px 34px rgba(217,169,78,.28)}
.btn svg{width:20px;height:20px;flex:none}
section{position:relative}
.sec{padding:110px 0}
.sec-head{display:grid;gap:14px;margin-bottom:44px;max-width:720px}
.sec-head.center{text-align:center;justify-items:center;margin-inline:auto}

/* fundo */
.bg-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
 radial-gradient(60% 50% at 85% 0%,rgba(59,130,246,.22),transparent 70%),
 radial-gradient(40% 40% at 0% 30%,rgba(217,169,78,.10),transparent 70%),var(--bg)}
.bg-fx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(80% 60% at 50% 20%,#000,transparent)}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.nav.on{background:rgba(4,7,13,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.nav .in{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand .esc{width:34px}
.brand .mk{width:118px}
.nav ul{display:none;list-style:none;margin:0;padding:0;gap:28px;font-size:.9rem;font-weight:600;color:var(--muted)}
.nav ul a{text-decoration:none}
.nav ul a:hover{color:var(--ink)}
.nav .btn{min-height:42px;padding:0 18px;font-size:.85rem}
@media (min-width:900px){.nav ul{display:flex}}

/* hero */
.hero{padding:calc(120px + env(safe-area-inset-top,0px)) 0 80px;min-height:100svh;display:flex;align-items:center;overflow:hidden}
.hero .grid{display:grid;gap:56px;align-items:center}
.hero-txt{display:grid;gap:22px;justify-items:start}
.hero h1{font-size:clamp(2.4rem,7.4vw,4.6rem);font-weight:900}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.82rem;font-weight:600;color:#D5DAE3}
.phone{position:relative;justify-self:center;width:min(330px,78vw)}
.phone .glow{position:absolute;inset:-14%;background:conic-gradient(from 0deg,rgba(59,130,246,.0),rgba(59,130,246,.55),rgba(217,169,78,.45),rgba(59,130,246,.0) 70%);filter:blur(40px);border-radius:50%;animation:spin 14s linear infinite;z-index:0}
.phone .frame{position:relative;z-index:1;border-radius:38px;padding:10px;background:linear-gradient(160deg,#1B2333,#070B13);border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.6)}
.phone video{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:30px;background:#000}
.phone .play{position:absolute;z-index:2;inset:0;display:grid;place-items:center;background:none;border:0;cursor:pointer;color:#fff}
.phone .play span{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(4,7,13,.55);backdrop-filter:blur(6px);border:1.5px solid rgba(255,255,255,.5);box-shadow:0 0 0 10px rgba(255,255,255,.08);transition:transform .2s}
.phone .play:hover span{transform:scale(1.07)}
.phone .play svg{width:28px;height:28px;margin-left:4px}
.phone .label{position:absolute;z-index:2;left:50%;bottom:-18px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#1A1206;font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:9px 16px;border-radius:999px;box-shadow:0 10px 30px rgba(217,169,78,.3)}
.float{position:absolute;z-index:3;background:rgba(10,17,30,.85);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:.8rem;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 14px 34px rgba(0,0,0,.4);animation:bob 5s ease-in-out infinite}
.float i{width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.float.a{top:12%;left:-18%}.float.b{top:46%;right:-20%;animation-delay:-1.6s}.float.c{bottom:16%;left:-14%;animation-delay:-3.2s}
@media (max-width:520px){.float.a{left:-6%}.float.b{right:-6%}.float.c{left:-4%}}
@media (min-width:960px){.hero .grid{grid-template-columns:1.15fr .85fr}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-8px)}}

/* marquee */
.logos{padding:34px 0;border-block:1px solid var(--line);background:rgba(255,255,255,.015);overflow:hidden}
.logos p{margin:0 0 18px;text-align:center;font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.track{display:flex;gap:18px;width:max-content;animation:marquee 38s linear infinite}
.track .lg{width:96px;height:96px;flex:none;border-radius:20px;background:#0E1626;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.track .lg img{width:100%;height:100%;object-fit:contain;padding:12px}
.track .lg.cover img{object-fit:cover;padding:0}
.logos:hover .track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}

/* servicos */
.services{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:720px){.services{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.services{grid-template-columns:repeat(4,1fr)}}
.svc{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border-radius:24px;padding:28px 24px;display:grid;gap:12px;align-content:start;overflow:hidden;transition:transform .3s,border-color .3s}
.svc::before{content:"";position:absolute;inset:-1px;border-radius:inherit;background:radial-gradient(60% 50% at 50% 0%,rgba(59,130,246,.25),transparent 70%);opacity:0;transition:opacity .3s}
.svc:hover{transform:translateY(-4px);border-color:rgba(96,165,250,.45)}
.svc:hover::before{opacity:1}
.svc>*{position:relative}
.svc .ic{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:rgba(217,169,78,.12);color:var(--gold-2)}
.svc .ic svg{width:26px;height:26px}
.svc h3{font-size:1.08rem;font-weight:800}
.svc ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;color:#C9D0DC;font-size:.93rem}
.svc li{position:relative;padding-left:18px}
.svc li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* trabalhos */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:26px;padding-bottom:2px}
.tabs button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 .9rem var(--font);cursor:pointer}
.tabs button[aria-pressed="true"]{background:linear-gradient(100deg,var(--gold),var(--gold-2));color:#1A1206;border-color:transparent}
.reels{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.reels{grid-template-columns:repeat(3,1fr);gap:16px}}
@media (min-width:1080px){.reels{grid-template-columns:repeat(4,1fr)}}
.reel{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0E1626;cursor:pointer;aspect-ratio:9/16;padding:0;color:inherit}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .tag{position:absolute;left:10px;bottom:10px;background:rgba(4,7,13,.7);backdrop-filter:blur(6px);border-radius:999px;padding:6px 11px;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.reel .exp{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(4,7,13,.6);backdrop-filter:blur(6px)}
.reel .exp svg{width:16px;height:16px}
.reel[hidden]{display:none}

/* passos */
.steps{display:grid;gap:16px;grid-template-columns:1fr;counter-reset:s}
@media (min-width:720px){.steps{grid-template-columns:1fr 1fr}}
@media (min-width:1080px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{border-radius:24px;padding:26px 24px;background:linear-gradient(160deg,rgba(59,130,246,.13),rgba(255,255,255,.015));border:1px solid rgba(59,130,246,.26);display:grid;gap:8px;align-content:start}
.step .n{font-weight:900;font-size:2.4rem;line-height:1;background:linear-gradient(180deg,var(--blue-2),rgba(96,165,250,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
.step h3{font-size:1.12rem;font-weight:800}
.step p{margin:0;color:var(--muted);font-size:.95rem}

/* equipe */
.team{display:grid;gap:44px;align-items:center}
@media (min-width:900px){.team{grid-template-columns:1.1fr 1fr}}
.diffs{display:grid;gap:12px;margin-top:8px}
.diff{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.diff .ck{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(217,169,78,.15);color:var(--gold-2)}
.diff .ck svg{width:16px;height:16px}
.diff b{display:block}
.diff span{color:var(--muted);font-size:.93rem}
.members{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.member{border-radius:22px;overflow:hidden;border:1px solid var(--line);aspect-ratio:3/4;position:relative}
.member img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;filter:saturate(.9)}
.member::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(4,7,13,.7))}
.member:nth-child(2){transform:translateY(26px)}

/* cta */
.cta{padding:110px 0 70px}
.cta-box{position:relative;overflow:hidden;border-radius:32px;padding:clamp(36px,7vw,72px) clamp(22px,6vw,64px);border:1px solid rgba(217,169,78,.35);background:radial-gradient(70% 90% at 100% 0%,rgba(59,130,246,.3),transparent 60%),radial-gradient(60% 80% at 0% 100%,rgba(217,169,78,.18),transparent 60%),var(--bg-2);display:grid;gap:18px;justify-items:center;text-align:center}
.cta-box h2{max-width:18ch}
.cta-box .ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:6px}
footer{padding:40px 0 calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
footer .in{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.88rem}
footer .soc{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--ink)}

/* whatsapp flutuante */
.wa-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#22C55E;color:#fff;box-shadow:0 12px 30px rgba(34,197,94,.4);text-decoration:none}
.wa-fab svg{width:30px;height:30px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(2,4,8,.9);backdrop-filter:blur(8px);padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lb.on{display:grid}
.lb video{max-height:86vh;max-width:min(480px,100%);border-radius:22px;background:#000}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:1.6rem;cursor:pointer}

/* revelar ao rolar */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.track,.phone .glow,.float{animation:none}html{scroll-behavior:auto}}
</style>
</head>

    ["Conteúdo pronto", "Você não precisa se preocupar: entregamos editado, legendado e postado."],
    ["Tudo agendado", "Calendário organizado para o seu perfil nunca ficar parado."]
  ];

  var logos = SITE.CLIENTES.map(function (f) { return '<div class="lg' + (/\.jpg$/.test(f) ? " cover" : "") + '"><img src="' + A("img/clientes/" + f) + '" alt="" loading="lazy"></div>'; }).join("");

  document.getElementById("app").innerHTML =
    '<header class="nav" id="nav"><div class="wrap in"><a class="brand" href="#topo" aria-label="Elite Marketing Digital"><img class="esc" src="' + A("img/escudo.png") + '" alt=""><img class="mk" src="' + A("img/marca.png") + '" alt="Elite Marketing Digital"></a>' +
    '<ul><li><a href="#servicos">Serviços</a></li><li><a href="#trabalhos">Trabalhos</a></li><li><a href="#como">Como trabalhamos</a></li><li><a href="#equipe">Equipe</a></li></ul>' +
    '<a class="btn gold-bg" href="' + wa + '" target="_blank" rel="noopener">Pedir proposta</a></div></header>' +

    '<main id="topo"><section class="hero"><div class="wrap grid">' +
    '<div class="hero-txt rv"><span class="kicker">Elite Marketing Digital</span>' +
    '<h1>Impulsione seu negócio com <span class="gold">conteúdo profissional</span> e estratégias digitais</h1>' +
    '<p class="lead">Fotografia, vídeo, gestão de redes sociais e tráfego pago em um só time. Mais visibilidade, mais cliques, mais clientes.</p>' +
    '<div class="ctas"><a class="btn gold-bg" href="' + wa + '" target="_blank" rel="noopener">' + IC.wa + 'Quero uma proposta</a><a class="btn" href="#trabalhos">Ver nossos trabalhos</a></div>' +
    '<div class="chips"><span class="chip">Fotos e vídeos no dia</span><span class="chip">Instagram e Facebook</span><span class="chip">Anúncios que trazem clientes</span></div></div>' +
    '<div class="phone rv"><div class="glow" aria-hidden="true"></div><div class="frame"><video id="apres" src="' + A(SITE.APRESENTACAO) + '#t=0.5" playsinline preload="metadata"></video></div>' +
    '<button class="play" id="play" type="button" aria-label="Assistir ao vídeo de apresentação"><span>' + IC.play + '</span></button>' +
    '<div class="float a"><i></i>Vídeos no dia</div><div class="float b"><i></i>Tráfego pago</div><div class="float c"><i></i>Gestão de redes</div>' +
    '<div class="label">Conheça a Elite</div></div></div></section>' +

    '<section class="logos" aria-label="Clientes"><p>Negócios que confiam na Elite</p><div class="track">' + logos + logos + "</div></section>" +

    '<section class="sec" id="servicos"><div class="wrap"><div class="sec-head rv"><span class="kicker">O que fazemos</span><h2>Tudo que o seu negócio precisa para <span class="gold">aparecer e vender</span></h2></div><div class="services">' +
    servicos.map(function (s) { return '<div class="svc rv"><div class="ic">' + IC[s[0]] + "</div><h3>" + s[1] + "</h3><ul>" + s[2].map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul></div>"; }).join("") +
    "</div></div></section>" +

    (videos.length ? '<section class="sec" id="trabalhos" style="padding-top:20px"><div class="wrap"><div class="sec-head rv"><span class="kicker">Nossos trabalhos</span><h2>Conteúdo real, feito para <span class="gold">clientes reais</span></h2><p class="lead">Toque em um vídeo para assistir com som.</p></div>' +
    '<div class="tabs" role="group" aria-label="Filtrar por segmento">' + segs.map(function (s, i) { return '<button type="button" data-seg="' + esc(s) + '" aria-pressed="' + (i === 0) + '">' + esc(s) + "</button>"; }).join("") + "</div>" +
    '<div class="reels">' + videos.map(function (v) {
      return '<button class="reel rv" type="button" data-seg="' + esc(v.seg) + '" data-src="' + A("videos/" + v.arquivo) + '" aria-label="Assistir vídeo de ' + esc(v.seg) + '"><video muted loop playsinline preload="none"></video><span class="tag">' + esc(v.seg) + '</span><span class="exp">' + IC.exp + "</span></button>";
    }).join("") + "</div></div></section>" : "") +

    '<section class="sec" id="como"><div class="wrap"><div class="sec-head rv"><span class="kicker">Como trabalhamos</span><h2>Do diagnóstico ao <span class="gold">cliente chegando</span></h2></div><div class="steps">' +
    passos.map(function (p, i) { return '<div class="step rv"><div class="n">0' + (i + 1) + "</div><h3>" + p[0] + "</h3><p>" + p[1] + "</p></div>"; }).join("") + "</div></div></section>" +

    '<section class="sec" id="equipe"><div class="wrap team"><div class="rv"><div class="sec-head" style="margin-bottom:22px"><span class="kicker">Quem somos</span><h2>Uma equipe que <span class="gold">vai até você</span></h2>' +
    '<p class="lead">Somos 3 profissionais especializados em produzir conteúdo de alta qualidade. Unimos fotografia, filmagem estratégica, gestão de redes sociais e tráfego pago para atrair mais clientes e aumentar o seu faturamento.</p></div>' +
    '<div class="diffs">' + difs.map(function (d) { return '<div class="diff"><span class="ck">' + IC.ck + "</span><div><b>" + d[0] + "</b><span>" + d[1] + "</span></div></div>"; }).join("") + "</div></div>" +
    '<div class="members rv">' + ["t1", "t2", "t3"].map(function (t) { return '<div class="member"><img src="' + A("img/" + t + ".jpg") + '" alt="Integrante da equipe Elite" loading="lazy"></div>'; }).join("") + "</div></div></section>" +

    '<section class="cta"><div class="wrap"><div class="cta-box rv"><span class="kicker">Vamos conversar?</span><h2>Pronto para sair na frente da <span class="gold">concorrência</span>?</h2>' +
    '<p class="lead">A gente cuida do tráfego, do conteúdo e da imagem do seu negócio. Você cuida de vender.</p>' +
    '<div class="ctas"><a class="btn gold-bg" href="' + wa + '" target="_blank" rel="noopener">' + IC.wa + 'Falar no WhatsApp</a>' +
    (SITE.INSTAGRAM ? '<a class="btn" href="https://www.instagram.com/' + esc(SITE.INSTAGRAM) + '" target="_blank" rel="noopener">@' + esc(SITE.INSTAGRAM) + "</a>" : "") + "</div></div></div></section></main>" +

    '<footer><div class="wrap in"><a class="brand" href="#topo"><img class="esc" src="' + A("img/escudo.png") + '" alt=""><img class="mk" src="' + A("img/marca.png") + '" alt="Elite Marketing Digital"></a>' +
    '<div class="soc"><a href="' + wa + '" target="_blank" rel="noopener">WhatsApp (19) 99263-3010</a>' + (SITE.INSTAGRAM ? '<a href="https://www.instagram.com/' + esc(SITE.INSTAGRAM) + '" target="_blank" rel="noopener">Instagram</a>' : "") + "</div>" +
    "<span>© " + new Date().getFullYear() + " Elite Marketing Digital</span></div></footer>" +
    '<a class="wa-fab" href="' + wa + '" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">' + IC.wa + "</a>" +
    '<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Vídeo"><button class="x" type="button" id="lbx" aria-label="Fechar">&times;</button><video id="lbv" controls playsinline></video></div>';

  /* nav ao rolar */
  var nav = document.getElementById("nav");
  function onScroll() { nav.classList.toggle("on", window.scrollY > 20); }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

  /* revelar ao rolar */
  var rvs = document.querySelectorAll(".rv");
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: 0.12 });
    rvs.forEach(function (el, i) { el.style.transitionDelay = (i % 4) * 70 + "ms"; io.observe(el); });
  } else rvs.forEach(function (el) { el.classList.add("in"); });

  /* vídeo de apresentação */
  var ap = document.getElementById("apres"), pl = document.getElementById("play");
  pl.addEventListener("click", function () { ap.controls = true; ap.play().catch(function () {}); pl.style.display = "none"; });
  ap.addEventListener("error", function () { var p = ap.closest(".phone"); if (p) p.style.display = "none"; });

  /* reels: tocam mudos quando aparecem; tocar abre com som */
  var reels = document.querySelectorAll(".reel");
  var rio = "IntersectionObserver" in window ? new IntersectionObserver(function (es) {
    es.forEach(function (e) { var v = e.target.querySelector("video"); if (e.isIntersecting) { if (!v.src) v.src = e.target.dataset.src; v.play().catch(function () {}); } else v.pause(); });
  }, { threshold: 0.3 }) : null;
  reels.forEach(function (r) {
    var v = r.querySelector("video");
    v.addEventListener("error", function () { r.remove(); });
    if (rio) rio.observe(r); else { v.src = r.dataset.src; }
    r.addEventListener("click", function () { abrir(r.dataset.src); });
  });

  /* filtro por segmento */
  document.querySelectorAll(".tabs button").forEach(function (b) {
    b.addEventListener("click", function () {
      var s = b.dataset.seg;
      document.querySelectorAll(".tabs button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      document.querySelectorAll(".reel").forEach(function (r) { r.hidden = !(s === "Todos" || r.dataset.seg === s); });
    });
  });

  /* lightbox */
  var lb = document.getElementById("lb"), lbv = document.getElementById("lbv");
  function abrir(src) { lbv.src = src; lb.classList.add("on"); document.body.style.overflow = "hidden"; lbv.play().catch(function () {}); }
  function fechar() { lbv.pause(); lbv.removeAttribute("src"); lbv.load(); lb.classList.remove("on"); document.body.style.overflow = ""; }
  document.getElementById("lbx").addEventListener("click", fechar);
  lb.addEventListener("click", function (e) { if (e.target === lb) fechar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && lb.classList.contains("on")) fechar(); });
})();
</script>
</body>
</html>
